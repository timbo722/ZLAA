name: Bug report
description: Something doesn't work, looks wrong, or the app closes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't attach or link any game files.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead. Screenshots or a short video help a lot.
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: Where in the game, and how to make it happen again
      description: The area, what you were doing, and whether it happens every time.
      placeholder: "On Toronbo Shores, swinging the sword at an enemy. Happened twice in about 20 minutes."
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "AYN Thor (Snapdragon 8 Gen 2), Android 13"
    validations:
      required: true
  - type: input
    id: zlaa
    attributes:
      label: ZLAA version
      description: Shown in Settings, About.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: game
    attributes:
      label: Game version
      options:
        - "1.0.0"
        - "1.0.1"
        - "1.1.0"
        - "I don't know"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: log.txt
      description: |
        Drag in `log.txt` from `Android/data/io.github.zlaa/files/` (right after the problem, before opening ZLAA again: the next start replaces it with a new one, and the old one becomes `log.prev.txt`). If the app closed on its own, attach the newest file in its `crashes` folder too.
    validations:
      required: true
